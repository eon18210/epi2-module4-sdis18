<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Contrôle EPI — Module 4</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --braise: #B0401F;
    --braise-dark: #7E2C15;
    --acier: #22282E;
    --acier-clair: #4A535C;
    --fond: #F2F1ED;
    --carte: #FFFFFF;
    --ligne: #D8D5CD;
    --ok: #2F6B3A;
    --alerte: #B0401F;
    --texte: #1B1E20;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
    background: var(--fond);
    color: var(--texte);
    padding-bottom: 60px;
  }
  header{
    background: var(--acier);
    color: #fff;
    padding: 18px 20px 16px;
  }
  header .sigle{
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #C7CCD1;
    margin-bottom: 2px;
  }
  header h1{
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    border-left: 4px solid var(--braise);
    padding-left: 10px;
  }
  main{
    max-width: 520px;
    margin: 0 auto;
    padding: 16px;
  }
  .bloc{
    background: var(--carte);
    border: 1px solid var(--ligne);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .bloc h2{
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--acier-clair);
  }
  label{
    display:block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  input[type="text"], select, textarea{
    width: 100%;
    padding: 10px;
    border: 1px solid var(--ligne);
    border-radius: 3px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }
  textarea{ resize: vertical; min-height: 60px; }
  .moment-choix{
    display:flex;
    gap: 8px;
  }
  .moment-choix button{
    flex:1;
    padding: 12px 4px;
    border: 1px solid var(--ligne);
    background: #fff;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
    color: var(--acier-clair);
  }
  .moment-choix button.actif{
    background: var(--acier);
    color: #fff;
    border-color: var(--acier);
  }
  .epi-item{
    border-top: 1px solid var(--ligne);
    padding-top: 14px;
    margin-top: 14px;
  }
  .epi-item:first-of-type{ border-top:none; margin-top:0; padding-top:0; }
  .epi-item .ligne-titre{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .epi-item .ligne-titre label{ margin:0; font-size:14px; }
  .etat-select{
    width: auto;
    font-size: 13px;
    padding: 6px 8px;
  }
  .zone-photo{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .apercu{
    width: 64px; height: 64px;
    border-radius: 3px;
    background: var(--fond);
    border: 1px dashed var(--ligne);
    object-fit: cover;
    flex-shrink:0;
  }
  .bouton-photo{
    flex:1;
    padding: 10px;
    background: var(--fond);
    border: 1px solid var(--ligne);
    border-radius: 3px;
    text-align:center;
    font-size: 13px;
    color: var(--acier-clair);
    cursor:pointer;
  }
  .bouton-photo.pris{
    border-color: var(--ok);
    color: var(--ok);
    background: #EEF5EE;
  }
  input[type="file"]{ display:none; }
  .envoyer{
    width:100%;
    padding: 15px;
    background: var(--braise);
    color:#fff;
    border:none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 4px;
  }
  .envoyer:disabled{ background: #B9AFA9; }
  #statut{
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    text-align:center;
    min-height: 20px;
  }
  #statut.ok{ color: var(--ok); }
  #statut.err{ color: var(--alerte); }
</style>
</head>
<body>

<header>
  <div class="sigle">SDIS 18 — Module 4 Équipier Incendie SPV</div>
  <h1>Contrôle EPI</h1>
</header>

<main>

  <div class="bloc">
    <h2>Stagiaire et moment du contrôle</h2>
    <label for="nom">Nom du stagiaire</label>
    <input type="text" id="nom" placeholder="Nom Prénom">

    <label style="margin-top:12px;" for="matricule">Matricule</label>
    <input type="text" id="matricule" placeholder="Matricule">

    <label style="margin-top:12px;" for="csSecours">CS de secours</label>
    <input type="text" id="csSecours" placeholder="Centre de secours">

    <label style="margin-top:12px;">Moment</label>
    <div class="moment-choix" id="momentChoix">
      <button type="button" data-val="Début de stage">Début</button>
      <button type="button" data-val="Contrôle en cours de stage">En cours</button>
      <button type="button" data-val="Fin de stage">Fin</button>
    </div>
  </div>

  <div class="bloc">
    <h2>Photos des EPI</h2>

    <div class="epi-item">
      <div class="ligne-titre">
        <label>Rangers</label>
        <select class="etat-select" data-etat="rangers">
          <option value="RAS">RAS</option>
          <option value="Usure visible">Usure visible</option>
          <option value="À remplacer">À remplacer</option>
        </select>
      </div>
      <div class="zone-photo">
        <img class="apercu" id="apercu-rangers" alt="">
        <div class="bouton-photo" id="btn-rangers">Prendre la photo</div>
      </div>
      <input type="file" accept="image/*" capture="environment" id="file-rangers">
    </div>

    <div class="epi-item">
      <div class="ligne-titre">
        <label>Gants d'attaque</label>
        <select class="etat-select" data-etat="gants">
          <option value="RAS">RAS</option>
          <option value="Usure visible">Usure visible</option>
          <option value="À remplacer">À remplacer</option>
        </select>
      </div>
      <div class="zone-photo">
        <img class="apercu" id="apercu-gants" alt="">
        <div class="bouton-photo" id="btn-gants">Prendre la photo</div>
      </div>
      <input type="file" accept="image/*" capture="environment" id="file-gants">
    </div>

    <div class="epi-item">
      <div class="ligne-titre">
        <label>Pantalon de feu</label>
        <select class="etat-select" data-etat="pantalon">
          <option value="RAS">RAS</option>
          <option value="Usure visible">Usure visible</option>
          <option value="À remplacer">À remplacer</option>
        </select>
      </div>
      <div class="zone-photo">
        <img class="apercu" id="apercu-pantalon" alt="">
        <div class="bouton-photo" id="btn-pantalon">Prendre la photo</div>
      </div>
      <input type="file" accept="image/*" capture="environment" id="file-pantalon">
    </div>

    <div class="epi-item">
      <div class="ligne-titre">
        <label>Veste de feu</label>
        <select class="etat-select" data-etat="veste">
          <option value="RAS">RAS</option>
          <option value="Usure visible">Usure visible</option>
          <option value="À remplacer">À remplacer</option>
        </select>
      </div>
      <div class="zone-photo">
        <img class="apercu" id="apercu-veste" alt="">
        <div class="bouton-photo" id="btn-veste">Prendre la photo</div>
      </div>
      <input type="file" accept="image/*" capture="environment" id="file-veste">
    </div>
  </div>

  <div class="bloc">
    <h2>Remarque (facultatif)</h2>
    <textarea id="commentaire" placeholder="Ex : rangers percées côté gauche, à signaler à l'habillement..."></textarea>
  </div>

  <div class="bloc">
    <h2>Destinataire du contrôle</h2>
    <label for="emailDestinataire">Adresse e-mail</label>
    <input type="email" id="emailDestinataire" value="vieon@sdis18.fr" placeholder="nom@sdis18.fr">
  </div>

  <button class="envoyer" id="btnEnvoyer">Envoyer le contrôle</button>
  <div id="statut"></div>

  <footer style="text-align:center; font-size:12px; color:#8A9096; margin-top:24px; padding:0 16px;">
    Application créée par Sch Eon Vincent — SDIS 18
  </footer>

</main>

<script>
/* ============================================================
   CONFIGURATION — à compléter avant mise en ligne
   1) EmailJS (emailjs.com) : service, template, clé publique
   2) imgbb (api.imgbb.com) : clé API — héberge les photos pour
      qu'elles arrivent en vrai lien dans le mail (Outlook bloque
      les images "codées en texte" directement dans le corps du mail)
   ============================================================ */
const EMAILJS_PUBLIC_KEY  = "x0m4gz5oZyfsyw3db";
const EMAILJS_SERVICE_ID  = "service_sdis18";
const EMAILJS_TEMPLATE_ID = "template_z95g1mo";
const IMGBB_API_KEY       = "c9166a3f91a41fff4edff2dc1e25f216";

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

// Reglages de compression avant envoi vers imgbb (juste pour aller
// plus vite en reseau mobile, pas de limite stricte comme avant)
const LARGEUR_DEPART = 900;  // pixels
const QUALITE_JPEG = 0.7;

let momentChoisi = "";
const photos = { rangers: null, gants: null, pantalon: null, veste: null };

// Selection du moment
document.querySelectorAll("#momentChoix button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#momentChoix button").forEach(b => b.classList.remove("actif"));
    btn.classList.add("actif");
    momentChoisi = btn.dataset.val;
  });
});

// Compression d'une image en dataURL JPEG
function compresserImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const largeur = Math.min(LARGEUR_DEPART, img.width);
        const ratio = largeur / img.width;
        const canvas = document.createElement("canvas");
        canvas.width = largeur;
        canvas.height = img.height * ratio;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", QUALITE_JPEG));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Upload d'une image compressee vers imgbb, retourne son URL publique
async function uploaderPhoto(dataUrl) {
  const base64 = dataUrl.split(",")[1];
  const formData = new FormData();
  formData.append("key", IMGBB_API_KEY);
  formData.append("image", base64);
  const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
  const json = await res.json();
  if (!json.success) throw new Error("upload imgbb echoue");
  return json.data.url;
}

// Cablage des 4 zones photo : prise -> compression -> upload -> apercu
["rangers", "gants", "pantalon", "veste"].forEach(item => {
  const btn = document.getElementById("btn-" + item);
  const input = document.getElementById("file-" + item);
  const apercu = document.getElementById("apercu-" + item);

  btn.addEventListener("click", () => input.click());

  input.addEventListener("change", async () => {
    if (!input.files[0]) return;
    photos[item] = null;
    btn.classList.remove("pris");
    btn.textContent = "Envoi de la photo...";
    try {
      const dataUrl = await compresserImage(input.files[0]);
      apercu.src = dataUrl;
      const url = await uploaderPhoto(dataUrl);
      photos[item] = url;
      btn.textContent = "Photo envoyee \u2713";
      btn.classList.add("pris");
    } catch (err) {
      btn.textContent = "Echec, reessaie";
      console.error(err);
    }
  });
});

// Envoi du mail (un seul, avec les liens vers les photos)
document.getElementById("btnEnvoyer").addEventListener("click", () => {
  const nom = document.getElementById("nom").value.trim();
  const matricule = document.getElementById("matricule").value.trim();
  const csSecours = document.getElementById("csSecours").value.trim();
  const emailDestinataire = document.getElementById("emailDestinataire").value.trim();
  const statut = document.getElementById("statut");
  statut.className = "";

  if (!nom) { statut.textContent = "Indique le nom du stagiaire."; statut.className = "err"; return; }
  if (!matricule) { statut.textContent = "Indique le matricule du stagiaire."; statut.className = "err"; return; }
  if (!csSecours) { statut.textContent = "Indique le CS de secours."; statut.className = "err"; return; }
  if (!emailDestinataire || !emailDestinataire.includes("@")) { statut.textContent = "Indique une adresse e-mail valide."; statut.className = "err"; return; }
  if (!momentChoisi) { statut.textContent = "Choisis le moment du controle."; statut.className = "err"; return; }

  const manquantes = Object.entries(photos).filter(([, v]) => !v).map(([k]) => k);
  if (manquantes.length) {
    statut.textContent = "Photo manquante ou pas encore envoyee : " + manquantes.join(", ");
    statut.className = "err";
    return;
  }

  const btnEnvoyer = document.getElementById("btnEnvoyer");
  btnEnvoyer.disabled = true;
  statut.textContent = "Envoi du mail...";

  const etats = {};
  document.querySelectorAll(".etat-select").forEach(sel => {
    etats[sel.dataset.etat] = sel.value;
  });

  const params = {
    to_email: emailDestinataire,
    stagiaire: nom,
    matricule: matricule,
    cs_secours: csSecours,
    moment: momentChoisi,
    date_controle: new Date().toLocaleString("fr-FR"),
    commentaire: document.getElementById("commentaire").value.trim() || "Aucune",
    etat_rangers: etats.rangers,
    etat_gants: etats.gants,
    etat_pantalon: etats.pantalon,
    etat_veste: etats.veste,
    photo_rangers: photos.rangers,
    photo_gants: photos.gants,
    photo_pantalon: photos.pantalon,
    photo_veste: photos.veste
  };

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .then(() => {
      statut.textContent = "Controle envoye \u2014 merci !";
      statut.className = "ok";
      btnEnvoyer.disabled = false;
    })
    .catch(err => {
      const detail = (err && (err.text || err.message)) ? (" \u2014 " + (err.text || err.message)) : "";
      statut.textContent = "Echec de l'envoi" + detail;
      statut.className = "err";
      btnEnvoyer.disabled = false;
      console.error(err);
    });
});
</script>

</body>
</html>
